<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- 仅供 Lyapunov Linux 进程使用；不加载或写入宿主字体配置/共享缓存。 -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>
  <cachedir prefix="xdg">lyapunov/fontconfig</cachedir>
  <alias binding="strong">
    <family>sans</family>
    <prefer><family>DejaVu Sans</family><family>Noto Sans SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family><family>Noto Sans SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>DejaVu Serif</family><family>Noto Sans SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>mono</family>
    <prefer><family>DejaVu Sans Mono</family><family>Noto Sans SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family><family>Noto Sans SC</family></prefer>
  </alias>
</fontconfig>
